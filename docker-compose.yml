services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MOCK_API_URL: http://openuntis:8000
    volumes:
      - sqlite_data:/var/www/html/database
      - laravel_storage:/var/www/html/storage
    depends_on:
      - openuntis

  openuntis:
    build:
      context: ./openuntis-mock
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

volumes:
  sqlite_data:
  laravel_storage:
