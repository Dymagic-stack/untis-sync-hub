services:
  - type: web
    name: openuntis-mock
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./openuntis-mock/Dockerfile
    dockerContext: ./openuntis-mock
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: MOCK_PORT
        value: 8000

  - type: web
    name: untis-sync-hub
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          type: web
          name: untis-sync-hub
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: MOCK_API_URL
        value: https://openuntis-mock.onrender.com

  - type: web
    name: untis-sync-runner
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./sync-runner/Dockerfile
    dockerContext: ./sync-runner
    healthCheckPath: /healthz
    envVars:
      - key: SYNC_INTERVAL_MS
        value: 300000
      - key: HUB_SYNC_URL
        fromService:
          type: web
          name: untis-sync-hub
          envVarKey: RENDER_EXTERNAL_URL